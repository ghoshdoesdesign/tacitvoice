[project]
name = "tacitvoice"
version = "0.1.0"
description = "Silent dictation for macOS: whisper or mouth a prompt, get text at the cursor"
requires-python = ">=3.10,<3.12"
dependencies = [
  "anthropic>=0.80",
  "fastapi>=0.111",
  "faster-whisper>=1.1",
  "mediapipe==0.10.14",
  "openai>=1.50",
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.9",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.6",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "six>=1.16",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "torch>=2.3",
  "uvicorn[standard]>=0.30",
  "gdown>=5.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
