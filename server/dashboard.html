<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TacitVoice history</title>
<style>
  :root { --bg: #fff; --ink: #111; --soft: #666; --line: #e4e4e4; --chip: #f1f1f1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --ink: #f2f2f2; --soft: #999; --line: #2a2a2a; --chip: #1f1f1f; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--soft); margin: 0 0 24px; }
  .row { border-top: 1px solid var(--line); padding: 14px 0; }
  .meta { color: var(--soft); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; }
  .heard { font-weight: 600; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .reply { white-space: pre-wrap; overflow-wrap: anywhere; }
  .failed { color: #c0392b; }
  #empty { color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>TacitVoice history</h1>
  <p class="sub">What you dictated and asked for on this Mac, newest first. Kept on this Mac only.</p>
  <div id="list"></div>
  <p id="empty" hidden></p>
</main>
<script>
"use strict";
// The token comes after the # in the address, which browsers never send to a
// server, and is used only to read this Mac's own history.
const token = location.hash.slice(1);
const list = document.getElementById("list");
const empty = document.getElementById("empty");

function element(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // never as HTML: this is dictated and fetched text
  return e;
}

function show(entries) {
  list.replaceChildren();
  empty.hidden = entries.length > 0;
  empty.textContent = "Nothing yet.";
  for (const entry of entries) {
    const row = element("div", "row");
    const meta = element("div", "meta");
    meta.append(element("span", "chip", entry.kind === "command" ? "Task" : "Dictation"),
                element("span", "", new Date(entry.ts * 1000).toLocaleString()));
    if (entry.seconds) meta.append(element("span", "", entry.seconds.toFixed(1) + " s"));
    row.append(meta, element("div", "heard", entry.heard || "(nothing recognised)"));
    if (entry.reply) row.append(element("div", "reply" + (entry.ok === false ? " failed" : ""), entry.reply));
    list.append(row);
  }
}

async function load() {
  try {
    const response = await fetch("/history", { headers: { Authorization: "Bearer " + token } });
    if (!response.ok) throw new Error(response.status === 401 ? "Open this page from the TacitVoice menu." : "Server error " + response.status);
    show((await response.json()).entries);
  } catch (e) {
    list.replaceChildren();
    empty.hidden = false;
    empty.textContent = e.message;
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
